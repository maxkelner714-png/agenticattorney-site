<title>AgenticAttorney.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Geist:wght@400;500;600&display=swap">
<style>
/* Layout: chat-app shell. Quiet sidebar with an audience tab switch, one centered reading column, the composer as the focal object. */
:root {
  --bg: #F6F3EC;
  --surface: #FDFCF9;
  --sidebar: #EEEAE1;
  --fg: #29261F;
  --muted: #6A645A;
  --line: #E2DCCF;
  --accent: #B5552F;
  --accent-hover: #9E4826;
  --on-accent: #FFFFFF;
  --bubble: #EAE4D7;
  --tab-track: #E3DDD0;
  --tab-on: #FDFCF9;
  --ok: #2F6B40;
  --gap: #8A5A0E;
  --scrim: rgba(30, 22, 12, .38);
  --shadow: 0 1px 2px rgba(60, 45, 30, .06), 0 4px 16px rgba(60, 45, 30, .06);
  --tab-shadow: 0 1px 2px rgba(60, 45, 30, .12);
  --drawer-shadow: 0 0 40px rgba(40, 28, 16, .18);
  --font-display: "Newsreader", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --font-ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --col: 46rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #232220; --surface: #2D2C29; --sidebar: #282724; --fg: #EFEBE2; --muted: #ABA597;
    --line: #403E38; --accent: #D97757; --accent-hover: #E58C6E; --on-accent: #1E1E1C;
    --bubble: #393834; --tab-track: #1E1D1B; --tab-on: #44423C; --ok: #86C294; --gap: #E0B25C; --scrim: rgba(0, 0, 0, .62);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    --tab-shadow: 0 1px 2px rgba(0,0,0,.4);
    --drawer-shadow: 0 0 40px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #232220; --surface: #2D2C29; --sidebar: #282724; --fg: #EFEBE2; --muted: #ABA597;
  --line: #403E38; --accent: #D97757; --accent-hover: #E58C6E; --on-accent: #1E1E1C;
  --bubble: #393834; --tab-track: #1E1D1B; --tab-on: #44423C; --ok: #86C294; --gap: #E0B25C; --scrim: rgba(0, 0, 0, .62);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  --tab-shadow: 0 1px 2px rgba(0,0,0,.4);
  --drawer-shadow: 0 0 40px rgba(0,0,0,.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font: 15px/1.55 var(--font-ui);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
* { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--muted) 38%, transparent) transparent; }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--muted) 38%, transparent); border: 3px solid transparent; background-clip: padding-box; border-radius: 99px; }
*::-webkit-scrollbar-track { background: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.top-cta:focus-visible, .send:focus-visible, .chip.primary:focus-visible, .mail-btn:focus-visible { outline-color: var(--fg); }
a { color: var(--accent-hover); text-underline-offset: 2px; }
.skip-link { position: absolute; left: 12px; top: -60px; z-index: 50; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-weight: 500; }
.skip-link:focus { top: 12px; }

.app { display: flex; height: 100%; }

/* Sidebar */
.sidebar {
  width: 272px; flex: none; background: var(--sidebar); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 4px; padding: 14px 10px 12px;
  overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; }
.mark {
  width: 28px; height: 28px; flex: none; border-radius: 8px; background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center; font: 500 19px/1 var(--font-display);
}
.mark:has(> .logo) { background: none; color: inherit; border-radius: 0; }
.mark .logo { width: 100%; height: 100%; display: block; }
.start-over { white-space: nowrap; }
.brand-name { font: 500 18.5px/1.1 var(--font-display); letter-spacing: -.012em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drawer-close { display: none; margin-left: auto; background: none; border: 0; padding: 6px; border-radius: 8px; color: var(--muted); }

/* Audience tabs: a two-way segmented switch */
.aud-tabs {
  display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 3px; margin: 0 0 10px;
  background: var(--tab-track); border-radius: 11px;
}
.aud-tab {
  border: 0; background: none; border-radius: 8px; padding: 7px 8px; font-size: 13.5px; color: var(--fg); transition: background-color .15s ease, color .15s ease;
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
.aud-tab svg { color: var(--muted); flex: none; }
.aud-tab[aria-selected="false"] { color: color-mix(in srgb, var(--muted) 80%, var(--fg)); }
.aud-tab[aria-selected="true"] { background: var(--tab-on); font-weight: 600; box-shadow: var(--tab-shadow), inset 0 0 0 1.5px var(--accent); }
.aud-tab[aria-selected="true"] svg { color: var(--accent); }
.home-tabs { display: none; width: 100%; max-width: 340px; margin: 0 auto; }

.nav-panel { display: grid; gap: 4px; align-content: start; }
.new-chat {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--line); text-align: left; font-weight: 500; transition: border-color .15s ease, box-shadow .15s ease;
}
.new-chat svg { color: var(--accent); }
.nav-group { display: grid; gap: 1px; }
.nav-label {
  font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
  padding: 18px 10px 6px; margin: 0;
}
.nav-item {
  display: block; width: 100%; text-align: left; background: none; border: 0; padding: 7px 10px; border-radius: 8px;
  font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background-color .12s ease;
}
.nav-item[aria-current="true"] { background: var(--bubble); font-weight: 500; }
#topicNav .nav-item { white-space: normal; text-overflow: clip; line-height: 1.35; }
.side-foot { margin-top: auto; padding: 14px 8px 0; display: grid; gap: 10px; border-top: 1px solid var(--line); }
.theme-toggle {
  display: flex; align-items: center; justify-content: space-between; width: 100%; background: none;
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; color: var(--muted);
}
.fineprint { font-size: 11.5px; line-height: 1.45; color: var(--muted); margin: 0; }
.fineprint b { font-weight: 500; color: var(--fg); }
.site-links { display: flex; align-items: center; gap: 6px; font-size: 11.5px; line-height: 1.4; color: var(--muted); margin: 0; }
.site-links a { color: inherit; text-decoration: none; }
.site-links span { opacity: .6; }
.home-links { justify-content: center; flex-wrap: wrap; margin-top: -8px; }
@media (hover: hover) { .site-links a:hover { color: var(--fg); text-decoration: underline; } }

/* Main */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; }
.topbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; min-height: 54px; flex: none; }
.menu-btn { display: none; background: none; border: 0; padding: 6px; border-radius: 8px; }
.top-title {
  font: 500 15px/1.3 var(--font-ui); margin: 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.005em;
}
.pill { font-size: 11.5px; letter-spacing: .01em; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; flex: none; }
.top-cta {
  margin-left: auto; flex: none; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 999px;
  padding: 7px 14px; font-size: 13.5px; font-weight: 500; transition: background-color .15s ease;
}

.scroll { flex: 1; overflow-y: auto; padding-inline: 16px; position: relative; }

/* Home */
.home { max-width: var(--col); margin: 0 auto; padding-block: 9vh 32px; display: grid; gap: 22px; }
.home-panel { display: grid; gap: inherit; }
.eyebrow { font-size: 12.5px; font-weight: 500; color: var(--accent-hover); text-align: center; margin: 0 0 -8px; letter-spacing: .06em; text-transform: uppercase; text-wrap: balance; }
.greeting {
  margin: 0; text-align: center; font: 400 clamp(30px, 4.6vw, 44px)/1.12 var(--font-display); letter-spacing: -.02em;
  text-wrap: balance; display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap;
}
.greeting .mark { width: 38px; height: 38px; border-radius: 10px; font-size: 26px; }
.home-note { text-align: center; font-size: 13px; line-height: 1.5; color: var(--muted); margin: -8px 0 0; text-wrap: balance; }
.starters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.starter {
  display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 15px 17px; line-height: 1.45;
  transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
}
.starter svg { grid-row: span 2; margin-top: 3px; color: var(--accent); }
.starter b { font-weight: 500; }
.starter span { color: var(--muted); font-size: 13.5px; line-height: 1.45; }
.legal { text-align: center; font-size: 11.5px; line-height: 1.5; color: var(--muted); margin: 6px 0 0; text-wrap: balance; max-width: 40rem; margin-inline: auto; }

/* Composer */
.composer {
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow);
  padding: 12px 12px 10px 16px; display: grid; gap: 6px; transition: border-color .15s ease, box-shadow .15s ease;
}
.composer:focus-within { border-color: var(--muted); box-shadow: var(--shadow), 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent); }
.composer textarea {
  width: 100%; border: 0; outline: 0; resize: none; background: transparent; color: var(--fg);
  font: 16px/1.5 var(--font-ui); max-height: 180px; min-height: 26px; padding: 2px 0;
}
.composer textarea::placeholder { color: var(--muted); }
.composer-row { display: flex; align-items: center; gap: 8px; }
.composer-hint { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; min-width: 0; }
.send {
  margin-left: auto; width: 34px; height: 34px; border-radius: 10px; border: 0; background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center; flex: none; transition: background-color .15s ease, opacity .15s ease;
}
.send:disabled { opacity: .35; cursor: default; }

/* Chat */
.thread { max-width: var(--col); margin: 0 auto; padding-top: 10px; display: grid; gap: 20px; }
.choices { max-width: var(--col); margin: 0 auto; padding: 18px 0 24px; }
.choices:empty { padding-top: 0; }
.msg.user { display: flex; justify-content: flex-end; }
.msg.user .bubble {
  background: var(--bubble); border-radius: 18px 18px 6px 18px; padding: 9px 15px; max-width: min(80%, 34rem); line-height: 1.5;
  overflow-wrap: anywhere; white-space: pre-wrap;
}
.msg.bot { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 14px; }
.msg.bot .mark { margin-top: 2px; }
.msg.bot .body { font: 17.5px/1.6 var(--font-display); min-width: 0; letter-spacing: .002em; }
.msg.bot .body > :first-child { margin-top: 0; }
.msg.bot .body > :last-child { margin-bottom: 0; }
.msg.bot p { margin: 0 0 .7em; }
.msg.bot ul, .msg.bot ol { margin: 0 0 .7em; padding-left: 1.25em; }
.msg.bot li { margin-bottom: .3em; }
.msg.bot h2 { font: 500 20px/1.3 var(--font-display); letter-spacing: -.01em; margin: 0 0 .4em; }
.step {
  display: block; font: 500 12px/1 var(--font-ui); letter-spacing: .05em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 8px;
}
.why { font: 14px/1.5 var(--font-ui); color: var(--muted); border-left: 2px solid var(--line); padding-left: 12px; margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding-left: 42px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 16px; font-size: 14px; line-height: 1.4;
  transition: background-color .12s ease, border-color .12s ease;
}
.chip.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chips.stack { flex-direction: column; align-items: flex-start; }
.chips.stack .chip { border-radius: 12px; text-align: left; max-width: 100%; padding: 9px 14px; }
.typing { display: flex; gap: 5px; align-items: center; height: 28px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); opacity: .5; animation: blink 1.1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; }
.typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25 } 40% { opacity: .9 } }

/* Hover only where a pointer can hover, so a tapped chip doesn't make the next answer look chosen */
@media (hover: hover) {
  .new-chat:hover { border-color: var(--muted); box-shadow: var(--tab-shadow); }
  .nav-item:hover, .menu-btn:hover, .drawer-close:hover { background: var(--bubble); }
  .aud-tab[aria-selected="false"]:hover { background: color-mix(in srgb, var(--tab-on) 55%, transparent); }
  .top-cta:hover, .send:not(:disabled):hover, .chip.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .starter:hover { border-color: var(--accent); box-shadow: var(--shadow); transform: translateY(-1px); }
  .chip:not(.primary):hover { border-color: var(--muted); background: var(--bubble); }
}

/* Cards inside replies */
.card, .plans { font: 14.5px/1.5 var(--font-ui); margin: 4px 0 .7em; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; gap: 12px; box-shadow: var(--shadow);
}
.meter-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.meter-row strong { font: 500 24px/1 var(--font-display); letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.meter { height: 6px; background: var(--bubble); border-radius: 99px; overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.badge { font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 999px; border: 1px solid color-mix(in srgb, currentColor 55%, transparent); background: color-mix(in srgb, currentColor 8%, transparent); }
.badge.fit { color: var(--ok); }
.badge.gaps { color: var(--gap); }
.gap-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.gap-list li { display: grid; gap: 2px; padding-top: 10px; border-top: 1px solid var(--line); }
.gap-list b { font-weight: 500; }
.gap-list span { color: var(--muted); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.placeholder { border-bottom: 1px dashed var(--muted); color: var(--muted); }
.mail-btn {
  display: inline-block; margin: 2px 0 .7em; padding: 8px 16px; border-radius: 999px; background: var(--accent); color: var(--on-accent);
  font: 500 14px/1.3 var(--font-ui); text-decoration: none;
}
@media (hover: hover) { .mail-btn:hover { background: var(--accent-hover); } }
.plans { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.plan {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 15px 16px;
  display: grid; gap: 4px; align-content: start; box-shadow: var(--shadow);
}
.plan b { font-weight: 500; }
.plan .price { font: 500 23px/1.2 var(--font-display); letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.plan .price small { font: 13px var(--font-ui); color: var(--muted); }
.plan p { margin: 0; color: var(--muted); font-size: 13.5px; }

.dock { padding: 0 16px 12px; }
.dock-inner { max-width: var(--col); margin: 0 auto; display: grid; gap: 8px; }
.dock .legal { margin: 0; }
.main:not(.is-chat) .dock { display: none; }
.main.is-chat .home { display: none; }

.scrim { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Tablet and phone: sidebar becomes a drawer, and the audience tabs also sit on the home screen */
@media (max-width: 820px) {
  .sidebar {
    position: fixed; inset: 0 auto 0 0; z-index: 20; transform: translateX(-100%); visibility: hidden;
    transition: transform .22s ease, visibility 0s linear .22s;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
  }
  .app.nav-open .sidebar { transform: none; visibility: visible; box-shadow: var(--drawer-shadow); transition-delay: 0s; }
  .app.nav-open .scrim { display: block; position: fixed; inset: 0; z-index: 10; background: var(--scrim); }
  .menu-btn, .drawer-close { display: grid; place-items: center; min-width: 44px; min-height: 44px; }
  .top-cta { min-height: 44px; }
  .new-chat, .nav-item, .theme-toggle, .aud-tab { min-height: 44px; }
  .scroll { overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; }
  .home { padding-top: 3vh; }
  .home-tabs { display: grid; }
  .pill { display: none; }
}
@media (max-width: 560px) {
  .starters, .plans { grid-template-columns: 1fr; }
  .top-cta { padding: 6px 12px; }
}
/* Phone: drop the avatar gutter so text and chips share one left edge; composer becomes one row */
@media (max-width: 480px) {
  .msg.bot { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .msg.bot > .mark { width: 22px; height: 22px; border-radius: 6px; font-size: 15px; }
  .chips { padding-left: 0; }
  .composer { grid-template-columns: minmax(0, 1fr) auto; align-items: end; padding: 8px 8px 8px 14px; border-radius: 18px; }
  .composer-row { display: contents; }
  .composer-hint { display: none; }
  .composer textarea { padding: 4px 0; }
  .send { width: 44px; height: 44px; border-radius: 12px; }
  .chip { min-height: 44px; padding: 9px 16px; }
  .mail-btn { min-height: 44px; display: inline-flex; align-items: center; padding: 10px 18px; }
  .home { gap: 16px; }
}
@media (max-height: 480px) {
  .topbar { min-height: 44px; padding-block: 6px; }
  .chip { min-height: 44px; }
  .send { width: 44px; height: 44px; border-radius: 12px; }
  .dock .legal { font-size: 10.5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  .typing i { animation: none; }
  .sidebar { transition: none !important; }
  .starter, .composer, .chip, .aud-tab, .nav-item, .new-chat, .send, .top-cta { transition: none; }
  .starter:hover { transform: none; }
}
/* Ambient backdrop: two slow warm blooms and a faint section mark behind the main column. Decorative only: hidden from assistive tech, no pointer events, clipped, static under reduced motion, dropped in print. */
:root { --amb-1: rgba(181, 85, 47, .07); --amb-2: rgba(222, 184, 110, .10); --amb-mark: .035; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --amb-1: rgba(217, 119, 87, .08); --amb-2: rgba(201, 150, 90, .06); --amb-mark: .05; }
}
:root[data-theme="dark"] { --amb-1: rgba(217, 119, 87, .08); --amb-2: rgba(201, 150, 90, .06); --amb-mark: .05; }
.main { position: relative; isolation: isolate; }
.ambient { position: absolute; inset: 0; overflow: hidden; z-index: -1; pointer-events: none; }
.ambient span { position: absolute; display: block; border-radius: 50%; will-change: transform; animation: ambient-drift 96s ease-in-out infinite alternate; }
.ambient .b1 { width: 70vmax; height: 70vmax; left: -22vmax; top: -30vmax; background: radial-gradient(circle at center, var(--amb-1), transparent 62%); }
.ambient .b2 { width: 60vmax; height: 60vmax; right: -24vmax; bottom: -26vmax; background: radial-gradient(circle at center, var(--amb-2), transparent 62%); animation-duration: 118s; animation-direction: alternate-reverse; }
.ambient .mark { right: 3%; bottom: -8%; border-radius: 0; font: 400 min(46vw, 460px)/1 var(--font-display); color: var(--accent); opacity: var(--amb-mark); animation: none; will-change: auto; user-select: none; }
@keyframes ambient-drift {
  from { transform: translate3d(0, 0, 0) scale(1); opacity: .9; }
  50% { transform: translate3d(5vmax, 3vmax, 0) scale(1.06); opacity: 1; }
  to { transform: translate3d(-3vmax, 5vmax, 0) scale(.97); opacity: .85; }
}
@media (prefers-reduced-motion: reduce) { .ambient span { animation: none; } }
@media print { .ambient { display: none; } }
</style>

<div class="app" id="app">

      nav: [{ flow: 'match', label: 'Find an attorney' }, { flow: 'audit', label: 'Free legal self-audit' }, { flow: 'how', label: 'How it works' }],
      learn: true,
      next: [
        { label: 'Find an attorney', value: 'match', primary: true },
        { label: 'Take the self-audit', value: 'audit' },
        { label: 'How it works', value: 'how' },
        { label: 'Learn the risks', value: 'learn' },
      ],
    },
    att: {
      eyebrow: 'Software for attorneys who serve agentic businesses',
      greeting: 'How can we help your practice?',
      note: 'Please keep client names, facts and figures out of this chat.',
      legal: "AgenticAttorney.com provides software to attorneys and is not a law firm. Using it doesn't change your own professional and advertising obligations.",
      dock: "Software for attorneys, not a law firm. Please don't share client information in this chat.",

    product: 'What does the software do?', demo: 'Show me a sample fit check', pricing: 'What does it cost?', access: "I'd like to join as an attorney",

  /* ---------- Chat engine ---------- */
  let audience = 'biz';
  let token = 0;
  let pending = null;
  let speaking = 0;
  let queued = [];

  let qid = 0;
  const STALE = Symbol('stale');

  let autoTop = -1;

      el.innerHTML = '<span class="mark" aria-hidden="true"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><path fill="var(--accent)" d="M29 5A27 27 0 0 0 29 59Z"/><path fill="var(--fg)" d="M35 5H57a5 5 0 0 1 5 5v44a5 5 0 0 1-5 5H35Z"/></svg></span><div class="body"><span class="sr-only">AgenticAttorney.com: </span>' + html + '</div>';

  /* strict asks belong to a running questionnaire: unmatched typing re-prompts instead of abandoning the answers so far.

  const STATE_CODES = 'al ak az ar ca co ct de dc fl ga hi id il in ia ks ky la me md ma mi mn ms mo mt ne nv nh nj nm ny nc nd oh ok or pa pr ri sc sd tn tx ut vt va wa wv wi wy'.split(' ');

  /* A state mentioned inside a sentence ("I'm in Florida, can you help?") or typed as a code (FL, N.Y.) */
  function findState(text) {

    const long = STATE_NAMES.slice().sort((a, b) => b.length - a.length).find((n) => new RegExp('\\b' + n + '\\b').test(l));
    if (long) return titleState(long);
    const code = (text.match(/\b([A-Z]{2})\b/g) || []).map((c) => c.toLowerCase()).find((c) => STATE_CODES.includes(c));

      const EXPLAIN = {
        'agent-authority': 'When an agent places an order or accepts terms on your behalf, the other side will usually argue that it had your authority to do so. Courts have long held people to deals made by assistants and systems they chose to use, and an AI agent is unlikely to be treated differently. That means the real question is not whether an agent can bind you but how far you want that authority to reach. Written limits, spending caps and a human sign-off above a threshold make the answer clear to your team and to the people you deal with.',
        'dead-owner-live-business': 'A business that runs on agents can keep taking orders, paying vendors and signing up customers after the person behind it is gone. Someone still owns the company, still owes its debts and still answers for what it does, and an estate may not even know the agents are running. Deciding now who takes over, who can stop operations and where the credentials live keeps the business from running without an owner. Attorneys treat this as succession planning, and it is a short conversation when it happens early.',
        'agent-output-liability': 'If an agent gives a customer a wrong answer, ships the wrong product or misses a deadline, the loss usually lands on the business that deployed it, not the company that built the model. Your contracts with vendors often limit what you can recover from them, and your contracts with customers decide what they can recover from you. Reading those two sets of clauses together shows where the exposure sits. Insurance and a clear review step for high-stakes outputs are the usual ways to shrink it.',
        'corporate-formalities-for-agents': 'An LLC or corporation protects its owners from the company\'s debts only while it behaves like a separate business, with its own records, accounts and decisions. When agents do most of the work, it is easy to stop keeping minutes, mix personal and company money, or let a bot act outside what the operating agreement allows. A creditor who can show the company was a formality may ask a court to reach the owners directly. Keeping records current and tying agent actions to real company decisions keeps the protection in place.',
        'kill-switch-governance': 'Every agentic business needs one named person who has both the legal authority and the technical access to stop every agent. Often those two things sit with different people, or the access lives in an account nobody else can reach. Writing down who decides, who can act and how to reach them turns a scramble into a procedure. It also tells investors, insurers and customers that someone is in charge.',
        'mcp-data-exposure': 'Connectors and tool integrations give agents access to data, and everything an agent touches can be requested in a lawsuit or regulatory inquiry. Logs, prompts and retrieved documents are records of the business like any other. Giving agents only the data they need, keeping access logs and setting retention periods reduces what has to be produced and what can be used against you. Data minimization is a legal strategy, not just a security one.',
      };
      await say(t, '<h2>' + esc(tp.title) + '</h2><p>' + esc(tp.blurb) + '</p><p>' + esc(EXPLAIN[tp.slug] || '') + '</p><p>A short video explainer is coming soon.</p><p class="why">Educational content only. Not legal advice.</p>');
      return nextSteps(t, []);
    },

    async outside(t) {
      await say(t, OUTSIDE_HTML);
      return nextSteps(t, ['match']);
    },

    /* Attorneys */
    async product(t, opts) {
      const intro = '<h2>A front door for your practice that AI agents can use.</h2>'
        + "<p>AgenticAttorney.com turns your public intake into a connector that a prospective client's AI agent can call. The agent reads your practice overview, runs the fit check you wrote, offers the prospect a free self-audit and books your intro call, all without you on the phone. Every response carries your disclaimers and tells the agent to use hypotheticals, so prospects are steered away from sending confidential facts before you are engaged. You keep the client relationship, your engagement terms and your own rules.</p>"
        + '<p>What would you like to see?</p>';
      const subs = [
        { label: 'The overview', value: 'intro' },
        { label: 'Agent-ready intake', value: 'intake' },
        { label: 'Client workspace', value: 'workspace' },
        { label: 'Built-in guardrails', value: 'guard' },
        { label: 'Getting found by businesses', value: 'found' },
        { label: 'Who owns the client relationship?', value: 'owner' },
        { label: 'Does this replace my intake tools?', value: 'tools' },
      ];
      const answers = {
        intake: "<p>The connector exposes only what you publish, as a small set of tools a prospect's agent can call. The agent sees your public profile and your questions, never your files or your other clients.</p><ul><li><b>Practice overview.</b> What you handle, what you don't, where you're licensed and your engagement terms in plain words.</li><li><b>Fit check.</b> Your yes-or-no questions, with gate questions that turn away matters you don't take and a pass mark you set. The agent gets a score and your reasons, not a legal opinion.</li><li><b>Self-audit.</b> A free educational check you can offer prospects, marked as education and not advice.</li><li><b>Onboarding and booking.</b> Prospects see your onboarding material and your booking link. Nothing is booked without the prospect's say-so.</li></ul>",
        workspace: "<p>The client workspace is for clients you have already engaged. The software sets up a workspace inside the client's own environment, with their agents and systems. You work there and leave the work product there, so the client never uploads their files to you.</p><p>What it is not: it is not a document management system, a billing tool or a place where AgenticAttorney.com holds client files. The client keeps their data in their environment. You keep your own notes, drafts and records under your own retention rules.</p>",
        guard: '<p>You set the guardrails once, in your settings, and every response the connector sends carries them.</p><ul><li>Every response tells the calling agent not to send confidential or identifying facts, and to use hypotheticals instead.</li><li>Every response carries your own disclaimers in your own words, such as when an attorney-client relationship begins under your engagement terms and that nothing on the connector is legal advice.</li><li>Your engagement terms live in one place, so every agent gets the same answer, and you can change them at any time.</li><li>You decide which questions are gates, what the referral says and where the pass mark sits.</li></ul>',
        found: "<p>Businesses can already request a match through the Businesses tab. Matching currently covers New York, California, Texas and Nevada, and will extend by practice area and state as attorneys join, subject to the advertising rules where you're licensed. A matched business learns your contact details only in the email reply, and you decide whether to take the call. Contributions to building the platform pay for software access, not for matches.</p>",
        owner: "<p>You do. AgenticAttorney.com is not a party to the engagement, does not practice law and does not share in fees. A prospect's agent talks to your connector, and from the intro call onward the relationship, the engagement letter, the scope and the fees are between you and your client. The platform sees no client files and no privileged material.</p>",
        tools: "<p>Not necessarily. The connector is an agent-facing front door. It sits in front of whatever you already use, and your booking link stays your booking link. If your intake form or calendar works for people, it keeps working for people. What the connector adds is a way for a prospect's agent to do the first pass on their behalf, with your questions and your disclaimers, before anyone books time. You can also run it on its own if you have no intake tools yet.</p>",
      };
      return faq(t, opts, intro, subs, answers, { label: 'Join as an attorney', value: 'access', primary: true }, 'product');
    },

    async demo(t) {
      await say(t, "<p>Here is a sample fit check for a made-up firm, the way a prospective client's AI agent would walk through it. The questions, the gate and the pass mark below are the sample firm's, not yours. Answer as the prospect would. In the software, you write your own questions, choose your own gates and set your own pass mark.</p>");
      const answers = {};
      for (let i = 0; i < DEMO.length; i++) {
        const q = DEMO[i];
        const a = await question(t, i, DEMO.length, q, q.opts || YES_NO);
        answers[q.id] = a;
        if (q.gate && a === 'no') {
          await say(t, "<h2>Outside the sample firm's practice.</h2><p>This is a gate question for the sample firm. The prospect gets a referral suggestion instead of a booking link, so nobody's time is wasted. In the software, you choose which questions are gates, what the referral says, and whether a gate ends the check or just notes a concern.</p>");
          return nextSteps(t, ['demo']);
        }
      }
      const gaps = DEMO.filter((q) => answers[q.id] !== (q.yes || 'yes'));
      const have = DEMO.length - gaps.length;
      const pass = have / DEMO.length >= 0.6;
      const text = pass
        ? '<h2>The prospect looks like a fit for the sample firm.</h2><p>Next the prospect sees the sample firm\'s onboarding material and booking link. In the software, you decide what a passing prospect sees next.</p>'
        : "<h2>Foundations first.</h2><p>This isn't a rejection. The prospect learns there is groundwork to do and can still book a call with the sample firm. In the software, you decide where the pass mark sits and what a prospect below it is told.</p>";
      await say(t, text + scoreCard(have, DEMO.length, pass ? 'fit' : 'gaps', pass ? 'Looks like a fit' : 'Foundations first', gaps)
        + "<p class=\"why\">This is what the prospect's agent reports back to the prospect. Sample only, for an unnamed made-up firm. In this demo, answers stay in this browser tab.</p>");
      return nextSteps(t, ['demo']);
    },

    async pricing(t) {
      await say(t, '<h2>Founding attorneys help build it.</h2>'
        + "<p>While AgenticAttorney.com is being built, there is no cash price for attorneys. Founding attorneys contribute AI credits or usage toward building the platform, and get early access to the software in return. Paid plans come later, once the platform is live.</p>"
        + '<div class="plans">'
        + '<div class="plan"><b>Founding attorney</b><div class="price">Credits or usage</div><p>Contribute AI credits or usage while the platform is built. Early access to agent-ready intake, guardrails and client workspaces, and a say in what gets built.</p></div>'
        + '<div class="plan"><b>Paid plans</b><div class="price">Later</div><p>Set once the platform is live. Founding attorneys hear about them first, and nothing changes for them without notice.</p></div>'
        + '</div>'
        + '<p>Three things to be clear about. Contributions pay for software access and never for matches or referrals. Nothing is charged on this site, and there is no card to enter. Your fees, scope and engagement terms stay between you and your clients.</p>'
        + '<p class="why">Preview only. How contributions work will be set out in the founding-attorney terms.</p>');
      return nextSteps(t, ['pricing']);
    },

    async access(t) {
      const body = 'Name:\nStates where you are licensed (and bar numbers):\nPractice areas:\nFirm name and size:\nWebsite and public profiles:\nWhy agentic businesses:\nCould you contribute AI credits or usage while the platform is built?\n';
      await say(t, '<h2>Join as a founding attorney.</h2>'
        + '<p>Email ' + esc(EMAIL) + ' with publicly available information about you and your practice. If it looks like a fit, we\'ll reply to set up a short video call. The button below opens a draft with the headings filled in.</p>'
        + '<p>What to send:</p><ul><li>Your name</li><li>The states where you\'re licensed, with bar numbers</li><li>Your practice areas</li><li>Your firm\'s name and size</li><li>Your website and public profiles</li><li>Why you want to serve agentic businesses</li><li>Whether you could contribute AI credits or usage while the platform is built</li></ul>'
        + mailLink('Joining AgenticAttorney.com', body, 'Email ' + EMAIL)
        + '<p class="why">Public information only. Please don\'t include anything about your clients.</p>');
      return nextSteps(t, ['access']);
    },

    /* Shared */
    async switch(t, opts) {
      const toAtt = opts.to === 'att';
      await say(t, toAtt
        ? "<p>It sounds like you're an attorney. The Attorneys tab covers the software for your practice.</p>"
        : "<p>It sounds like you're looking for an attorney. The Businesses tab helps with that.</p>");
      const v = await ask(t, [{ label: toAtt ? 'Go to the Attorneys tab' : 'Go to the Businesses tab', value: 'go', primary: true }, { label: 'Stay here', value: 'stay' }], false);
      if (v === 'go') { setAudience(opts.to); (coarse ? document.getElementById('tab-' + opts.to) : input).focus({ preventScroll: true }); return; }
      return nextSteps(t, [], '<p>No problem. Here is what I can help with on this tab:</p>');
    },

    async chat(t, opts) {
      const text = opts.text;
      const lower = norm(text);
      const route = routeFor(lower);
      if (looksConfidential(text)) {
        await say(t, audience === 'biz'
          ? "<p>Please hold specifics like names, figures and contract terms for the attorney you engage. This chat isn't privileged.</p>"
          : "<p>Please leave client names, facts and figures out of this chat. It isn't confidential.</p>");
        if (!route) return nextSteps(t, [], '<p>Here is what I can help with from here:</p>');
      } else if (!route && /^(hi|hello|hey|good (morning|afternoon|evening))\b/.test(lower)) {
        await say(t, "<p>Hello. I'm the guided assistant for AgenticAttorney.com. Where would you like to start?</p>");
        return nextSteps(t, []);
      }
      if (route) {
        await wait(150);
        if (t !== token) return;
        return start(route.kind, route);
      }
      await say(t, "<p>I'm a guided assistant for now, so I can't answer open-ended questions yet. Here is what I can help with:</p>");
      return nextSteps(t, []);
    },
  };

  /* ---------- Typed input ---------- */
  function handleTyped(text) {
    if (pending) {
      const l = norm(text);
      const match = pending.options.find((o) => matches(o, l));
      if (match) { pending.choose(match, text); return; }
      if (pending.freeText) {
        const st = looksConfidential(text) ? null : findState(text);
        const abroad = pending.options.find((o) => o.value === 'abroad');
        if (!st && abroad && ABROAD_RE.test(l)) pending.choose(abroad, text);
        else if (!st) pending.nudge(text);
        else pending.choose(pending.options.find((o) => o.value === st) || { label: st, value: st }, text);
        return;
      }
      if (pending.strict) { pending.nudge(text); return; }
    } else if (speaking > 0 && main.classList.contains('is-chat')) {
      queued.push(text); /* a reply is still typing; apply this to the next question */
      return;
    }
    start('chat', { text, userText: text });
  }

  /* ---------- Audience tabs ---------- */
  function renderAudience() {
    const A = AUD[audience];
    $('#eyebrow').textContent = A.eyebrow;
    $('#greetText').textContent = A.greeting;
    $('#homeNote').textContent = A.note;
    $('#starters').innerHTML = A.starters.map((s) => '<button class="starter" type="button" data-flow="' + s.flow + '">' + icon(s.icon) + '<b>' + esc(s.title) + '</b><span>' + esc(s.sub) + '</span></button>').join('');
    $('#homeLegal').textContent = A.legal;
    $('#dockLegal').textContent = A.dock;
    $('#fineprint').innerHTML = A.fine;
    $('#topCta').textContent = A.cta.label;
    $('#topCta').dataset.flow = A.cta.flow;
    $('#startNav').innerHTML = A.nav.map((n) => '<button class="nav-item" type="button" data-flow="' + n.flow + '">' + esc(n.label) + '</button>').join('');
    $('#learnGroup').hidden = !A.learn;
    $('#hintText').textContent = A.hint;
    resetPlaceholder();
    document.querySelectorAll('.aud-tab').forEach((b) => {
      const on = b.dataset.aud === audience;
      b.setAttribute('aria-selected', String(on));
      b.tabIndex = on ? 0 : -1;
    });
    $('#navPanel').setAttribute('aria-labelledby', 'tab-' + audience);
    $('#homePanel').setAttribute('aria-labelledby', 'tab-' + audience + '-m');
  }

  function audFromHash() {
    const h = (location.hash || '').toLowerCase();
    return /attorney|lawyer/.test(h) ? 'att' : /business/.test(h) ? 'biz' : null;
  }

  function setAudience(a) {
    if (a !== audience) {
      audience = a;
      try { history.replaceState(null, '', a === 'att' ? '#attorneys' : '#businesses'); } catch (e) {}
    }
    renderAudience();
    goHome();
  }

  document.querySelectorAll('.aud-tabs').forEach((list) => {
    const tabs = [...list.querySelectorAll('.aud-tab')];
    tabs.forEach((b) => b.addEventListener('click', () => {
      if (b.dataset.aud !== audience) setAudience(b.dataset.aud);
    }));
    list.addEventListener('keydown', (e) => {
      const i = tabs.indexOf(document.activeElement);
      if (i < 0) return;
      let j = null;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') j = (i + 1) % tabs.length;
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') j = (i - 1 + tabs.length) % tabs.length;
      else if (e.key === 'Home') j = 0;
      else if (e.key === 'End') j = tabs.length - 1;
      if (j === null) return;
      e.preventDefault();
      tabs.forEach((x, k) => { x.tabIndex = k === j ? 0 : -1; });
      tabs[j].focus();
    });
  });
  addEventListener('hashchange', () => {
    const a = audFromHash();
    if (a && a !== audience) setAudience(a);
  });

  /* ---------- Navigation drawer ---------- */
  function setDrawer(open, returnFocus) {
    const drawer = drawerMQ.matches;
    app.classList.toggle('nav-open', open && drawer);
    $('#menuBtn').setAttribute('aria-expanded', String(open && drawer));
    if (drawer && !open && sidebar.contains(document.activeElement)) { const tt = $('#topTitle'); tt.tabIndex = -1; tt.focus({ preventScroll: true }); }
    sidebar.inert = drawer && !open;
    main.inert = drawer && open;
    if (drawer && open) sidebar.querySelector('.aud-tab[aria-selected="true"]').focus();
    else if (returnFocus) $('#menuBtn').focus();
  }
  drawerMQ.addEventListener('change', () => setDrawer(false));
  setDrawer(false);

  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-flow]');
    if (!b || e.detail > 1) return;
    setDrawer(false);
    const kind = b.dataset.flow;
    start(kind, { userText: STARTER_LABELS[kind] });
  });

  const topicNav = $('#topicNav');
  TOPICS.forEach((tp) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'nav-item';
    b.textContent = tp.title;
    b.dataset.slug = tp.slug;
    b.addEventListener('click', (e) => {
      if (e.detail > 1) return;
      setDrawer(false);
      start('topic', { slug: tp.slug, userText: tp.title });
    });
    topicNav.append(b);
  });

  $('#newChat').addEventListener('click', () => {
    setDrawer(false);
    goHome();
    if (!coarse) input.focus();
  });
  $('#menuBtn').addEventListener('click', () => setDrawer(!app.classList.contains('nav-open')));
  $('#drawerClose').addEventListener('click', () => setDrawer(false, true));
  $('#scrim').addEventListener('click', () => setDrawer(false, true));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && app.classList.contains('nav-open')) setDrawer(false, true);
  });

  function autosize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 180) + 'px';
    send.disabled = !input.value.trim();
  }
  input.addEventListener('input', autosize);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      composer.requestSubmit();
    }
  });
  let lastSent = { text: '', at: 0 };
  composer.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    const now = performance.now();
    if (text === lastSent.text && now - lastSent.at < 700) { input.value = ''; autosize(); return; } /* a double send of the same line */
    lastSent = { text, at: now };
    input.value = '';
    autosize();
    handleTyped(text);
  });

  /* ---------- Theme: System, Light, Dark ---------- */
  const THEMES = ['system', 'light', 'dark'];
  let theme = 'system';
  try { theme = localStorage.getItem('aa-theme') || 'system'; } catch (e) {}
  if (!THEMES.includes(theme)) theme = 'system';
  function applyTheme() {
    if (theme === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', theme);
    $('#themeLabel').textContent = theme[0].toUpperCase() + theme.slice(1);
    $('#themeToggle').setAttribute('aria-label', 'Theme: ' + $('#themeLabel').textContent + '. Change theme');
  }
  $('#themeToggle').addEventListener('click', () => {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    try { localStorage.setItem('aa-theme', theme); } catch (e) {}
    applyTheme();
  });
  applyTheme();

  audience = audFromHash() || 'biz';
  if (!audFromHash()) { try { history.replaceState(null, '', audience === 'att' ? '#attorneys' : '#businesses'); } catch (e) {} }
  renderAudience();
  placeComposer();
})();
</script>
